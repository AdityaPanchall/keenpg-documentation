
site_name: KeenPGO Documentation
site_url: https://adityapanchall.github.io/keenpg-documentation/
site_description: Documentation for KeenPGO Console and PostgreSQL management
site_author: Aditya

docs_dir: docs

theme:
  name: material

  logo: assets/images/console/keenpg-logo.svg
  favicon: assets/images/console/keenpg-logo.png

  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - glightbox
  - macros

extra:
  release: "6.0"

markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.smartsymbols
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Features: features.md
  - Architecture:
      - "HA architecture": architecture/ha.md
      - "Backup and Restore": architecture/backupandrestore.md
      - "DR detailed architecture": architecture/dr.md
      - "Monitoring stack": architecture/monitoring.md
  - Installation:
      - Installation/index.md
      - "Installation on Minikube": Installation/minikube.md
      - "Installation on Kubernetes": Installation/kubernetes.md
      - "Installation on OpenShift": Installation/openshift.md
      - "Installation via Helm charts": Installation/helm.md
      - "Installation in Disconnected Environment": Installation/disconnected.md
  - Guide to Console: console.md
  - DB Cluster:
      - "Detail DB Instance": db/detail.md
      - "Postgres Parameter": db/parameter.md
      - "User Management": db/user.md
      - "pg_hba Management": db/pghba.md
  - Backup and restore: backups.md
  - Monitoring: monitoring.md
  - Logging: logging.md
  - Security: security.md
  - Support: support.md
  - Troubleshooting: troubleshooting.md

extra_css:
  - stylesheets/extra.css
